<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最新消息與數據圖表</title>
    <!-- 引入 Chart.js 前端圖表套件 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --bg-color: #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: #333;
        }
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 1.5rem;
            text-align: center;
        }
        /* RWD 核心：使用 Flexbox 讓區塊自動折行與縮放 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
        }
        .news-section {
            flex: 1 1 300px; /* 最小寬度 300px，剩餘空間按比例放大 */
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .news-item {
            border-bottom: 1px solid #eee;
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }
        .news-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        .news-date {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 0.3rem;
        }
        .news-item h3 {
            margin: 0 0 0.5rem 0;
            font-size: 1.1rem;
        }
        .news-item p {
            margin: 0;
            font-size: 0.95rem;
            color: #555;
        }
        .chart-section {
            flex: 2 1 500px; /* 最小寬度 500px，佔據較大比例 */
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        canvas {
            width: 100% !important;
            max-height: 400px;
        }
    </style>
</head>
<body>

<header>
    <h1>資訊儀表板</h1>
</header>

<div class="container">
    <!-- 區塊 1：最新消息 -->
    <section class="news-section">
        <h2>最新消息</h2>
        <div class="news-item">
            <div class="news-date">2026-09-21</div>
            <h3>系統更新通知</h3>
            <p>本系統已更新至最新版本，並優化了前端響應式排版。</p>
        </div>
        <div class="news-item">
            <div class="news-date">2026-09-15</div>
            <h3>資料庫準備作業</h3>
            <p>前端圖表框架已建置完成，等待後端 MySQL API 對接。</p>
        </div>
    </section>

    <!-- 區塊 2：數據圖表 -->
    <section class="chart-section">
        <h2>數據統計圖表 <small style="color:#888; font-size:1rem;">(未來對接 MySQL)</small></h2>
        <canvas id="myChart"></canvas>
    </section>
</div>

<script>
    // 1. 初始化 Chart.js 圖表（目前使用靜態假資料）
    const ctx = document.getElementById('myChart').getContext('2d');
    let myChart = new Chart(ctx, {
        type: 'bar', // 可改為 'line', 'pie' 等
        data: {
            labels: ['一月', '二月', '三月', '四月', '五月', '六月'],
            datasets: [{
                label: '系統訪問量',
                data: [12, 19, 3, 5, 2, 3], // 未來這裡將被 MySQL 資料替換
                backgroundColor: 'rgba(54, 162, 235, 0.5)',
                borderColor: 'rgba(54, 162, 235, 1)',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });

    /*

     * 讓這個部署在 GitHub 的前端網頁來拉取資料。
     */
    async function fetchMySQLData() {
        try {
            // 替換成您未來的後端 API 網址
            // const response = await fetch('https://api.yourdomain.com/get_chart_data');
            // const dbData = await response.json();
            
            // 假設 dbData 的格式為 { labels: ['A', 'B'], values: [100, 200] }
            // myChart.data.labels = dbData.labels;
            // myChart.data.datasets[0].data = dbData.values;
            
            // 通知圖表重新渲染更新
            // myChart.update();
            console.log("未來在此處執行 MySQL 資料對接並動態更新圖表");
        } catch (error) {
            console.error("無法取得資料庫數據:", error);
        }
    }

    // 啟動頁面時嘗試獲取最新資料（未來啟用）

</script>
</body>
</html>
